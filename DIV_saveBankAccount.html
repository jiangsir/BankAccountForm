<div class="input-group mb-2">
    <div class="form-group">
        <label for="paymentMethod">退款方式:</label>
        <select id="paymentMethod" name="paymentMethod" class="form-control">
            <option value="現金">現金</option>
            <option value="受款學生本人帳戶">受款學生本人帳戶</option>
            <option value="法定代理人帳戶">法定代理人帳戶</option>
        </select>
    </div>
    <div class="form-group">
        <label for="classname">班級:</label>
        <input type="text" id="classname" name="classname" class="form-control" placeholder="班級">
    </div>
    <div class="form-group">
        <label for="sitenum">座號:</label>
        <input type="text" id="sitenum" name="sitenum" class="form-control" placeholder="座號">
    </div>
    <div class="form-group">
        <label for="studentid">學號:</label>
        <input type="text" id="studentid" name="studentid" class="form-control" placeholder="學號">
    </div>
    <div class="form-group">
        <label for="studentname">姓名:</label>
        <input type="text" id="studentname" name="studentname" class="form-control" placeholder="姓名">
    </div>
    <div class="form-group">
        <label for="bankAccount">退款銀行帳戶:</label>
        <input type="text" id="bankAccount" name="bankAccount" class="form-control" placeholder="輸入退款銀行帳戶">
    </div>
    <div class="input-group-append">
        <button class="btn btn-primary btn-lg" onclick="saveBankAccount()">儲存</button>
    </div>
</div>
