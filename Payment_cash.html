<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <!-- Include Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">

    <!-- Include Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <!-- Custom CSS -->
    <style>
        h1 {
            font-size: 5rem;
            /* Change this to adjust the size of the h1 text */
        }

        .form-control {
            height: auto;
            /* Change this to adjust the size of the input field */
            font-size: 1.5rem;
            /* Change this to adjust the size of the input text */
        }

        .invisible {
            opacity: 0;
        }
    </style>
    <script>
        function showError(message) {
            var modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = message;
            $('#errorModal').modal('show');
        }

        function validateFields() {
            var classname = document.getElementById('classname').value;
            var sitenum = document.getElementById('sitenum').value;
            var studentname = document.getElementById('studentname').value;
            var studentid = document.getElementById('studentid').value;
            var fileInput1 = document.getElementById('fileAttachment1').files.length;
            var fileInput2 = document.getElementById('fileAttachment3').files.length;

            if (!classname) {
                showError('班級未填寫');
                return false;
            }
            if (!sitenum) {
                showError('座號未填寫');
                return false;
            }
            if (!studentname) {
                showError('學生姓名未填寫');
                return false;
            }
            if (!studentid) {
                showError('學號未填寫');
                return false;
            }
            if (!fileInput1) {
                showError('「附件1」未選擇');
                return false;
            }
            if (!fileInput2) {
                showError('「附件3」未選擇');
                return false;
            }
            return true;
        }

        function saveCash() {
            if (!validateFields()) {
                return;
            }
            updatingButton();

            var classname = document.getElementById('classname').value;
            var sitenum = document.getElementById('sitenum').value;
            var studentname = document.getElementById('studentname').value;
            var studentid = document.getElementById('studentid').value;
            var userEmail = document.getElementById('userEmail').value;
            var paymentMethod = document.getElementById('paymentMethod').value;

            // 获取文件
            var fileInput1 = document.getElementById('fileAttachment1');
            var fileInput2 = document.getElementById('fileAttachment3');
            var file1 = fileInput1.files[0];
            var file2 = fileInput2.files[0];
            var files = [file1, file2];
            var fileIds = [];

            if (file1 || file2) {
                var filesProcessed = 0;

                var readFile = function (file, index) {
                    if (!file) {
                        fileIds[index] = null;
                        filesProcessed++;
                        checkAllFilesProcessed();
                        return;
                    }

                    var reader = new FileReader();
                    reader.onload = function (e) {
                        var base64Data = e.target.result.split(',')[1];
                        google.script.run.withSuccessHandler(function (fileId) {
                            fileIds[index] = fileId;
                            filesProcessed++;
                            checkAllFilesProcessed();
                        }).uploadFile(base64Data, file.name);
                    };
                    reader.readAsDataURL(file);
                };

                var checkAllFilesProcessed = function () {
                    if (filesProcessed === files.length) {
                        google.script.run.saveDatasToSheet(studentid, null, userEmail, paymentMethod, classname, sitenum, studentid, studentname, null, null, null, null, null, null, fileIds[0], null, fileIds[1]);
                        updateButton();
                    }
                };

                for (var i = 0; i < files.length; i++) {
                    readFile(files[i], i);
                }
            } else {
                // 没有文件时，直接保存银行账户信息
                google.script.run.saveDatasToSheet(studentid, null, userEmail, paymentMethod, classname, sitenum, studentid, studentname, null, null, null, null, null, null, null, null, null);
                updateButton();
            }
        }
        function updatingButton() {
            var saveButton = document.getElementById('saveButton');
            saveButton.disabled = true;
            saveButton.innerHTML = '資料儲存中...';
            saveButton.classList.add('btn-secondary');
            saveButton.classList.remove('btn-primary');
        }

        function updateButton() {
            var saveButton = document.getElementById('saveButton');
            saveButton.disabled = true;
            saveButton.innerHTML = '資料已儲存';
            saveButton.classList.add('btn-secondary');
            saveButton.classList.remove('btn-primary');
        }

        console.log('userEmail: <?= userEmail ?>');
        console.log('userAccount: <?= userAccount ?>');
        console.log('userDomain: <?= userDomain ?>');
    </script>
</head>

<body>
    <div class="container d-flex vh-100">
        <div class="row justify-content-center w-100">
            <div class="col-md-12">
                <h1 class="text-center mb-4">國立高雄師大附中</h1>
                <h2 class="text-center mb-4">學生各項費用領款及退費登記系統</h2>
                <h4>登入帳號:
                    <?= userEmail ?>
                </h4>
                <h4>匯款方式:
                    <?= paymentMethod  ?>
                </h4>
                <div class="input-group col-12">
                    <input type="hidden" id="userEmail" name="userEmail" class="form-control" value="<?= userEmail ?>">
                    <input type="hidden" id="paymentMethod" name="paymentMethod" class="form-control"
                        value="<?= paymentMethod ?>">

                    <div class="form-group col-12">
                        <label for="classname">班級:</label>
                        <input type="text" id="classname" name="classname" class="form-control" placeholder="班級">
                    </div>
                    <div class="form-group col-12">
                        <label for="sitenum">座號:</label>
                        <input type="text" id="sitenum" name="sitenum" class="form-control" placeholder="座號">
                    </div>
                    <div class="form-group col-12">
                        <label for="studentname">學生姓名:</label>
                        <input type="text" id="studentname" name="studentname" class="form-control" placeholder="學生姓名">
                    </div>
                    <div class="form-group col-12">
                        <label for="studentid">學號:</label>
                        <input type="text" id="studentid" name="studentid" class="form-control" placeholder="學號"
                            value="<?= userAccount ?>" readonly="readonly">
                    </div>
                    <div class="form-group col-12">
                        <h4>
                            <a
                                href="https://docs.google.com/document/d/1Lr-_tyDJiHzRGUL8hlE4PXWswF14V6l3/edit?usp=drive_link">附件1-個人資料提供同意書</a>
                        </h4>
                        <label for="fileAttachment1">上傳「附件1-個人資料提供同意書」:</label>
                        <input type="file" id="fileAttachment1" name="fileAttachment1" class="form-control">
                    </div>
                    <div class="form-group col-12">
                        <h4><a
                                href="https://docs.google.com/document/d/1fNGUGGtQzxhbxaOgTciAWcqjDpCL9daH/edit?usp=drive_link">附件3-領用現金同意書
                            </a>
                        </h4>
                        <label for="fileAttachment3">上傳「附件3-領用現金同意書」:</label>
                        <input type="file" id="fileAttachment3" name="fileAttachment3" class="form-control">
                    </div>
                </div>
                <div class="form-group col-12">
                    <button id="saveButton" class="btn btn-primary btn-lg btn-block" onclick="saveCash()">儲存</button>
                </div>
                <h4 id="output"></h4>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="errorModal" tabindex="-1" role="dialog" aria-labelledby="errorModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">錯誤</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- 錯誤消息將顯示在這裡 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">關閉</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
