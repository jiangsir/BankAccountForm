    <script>
        function showError(message) {
            var modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = message;
            $('#errorModal').modal('show');
        }

        function validateFields() {
            var classname = document.getElementById('classname').value;
            var sitenum = document.getElementById('sitenum').value;
            var studentname = document.getElementById('studentname').value;
            var studentid = document.getElementById('studentid').value;
            var fileInput1 = document.getElementById('fileAttachment1').files.length;
            var fileInput2 = document.getElementById('fileAttachment3').files.length;

            if (!classname) {
                showError('班級未填寫');
                return false;
            }
            if (!sitenum) {
                showError('座號未填寫');
                return false;
            }
            if (!studentname) {
                showError('學生姓名未填寫');
                return false;
            }
            if (!studentid) {
                showError('學號未填寫');
                return false;
            }
            if (!fileInput1) {
                showError('「附件1」未選擇');
                return false;
            }
            if (!fileInput2) {
                showError('「附件3」未選擇');
                return false;
            }
            return true;
        }

        function saveCash() {
            if (!validateFields()) {
                return;
            }
            updatingButton();

            var classname = document.getElementById('classname').value;
            var sitenum = document.getElementById('sitenum').value;
            var studentname = document.getElementById('studentname').value;
            var studentid = document.getElementById('studentid').value;
            var userEmail = document.getElementById('userEmail').value;
            var paymentMethod = document.getElementById('paymentMethod').value;

            // 获取文件
            var fileInput1 = document.getElementById('fileAttachment1');
            var fileInput2 = document.getElementById('fileAttachment3');
            var file1 = fileInput1.files[0];
            var file2 = fileInput2.files[0];
            var files = [file1, file2];
            var fileIds = [];

            if (file1 || file2) {
                var filesProcessed = 0;

                var readFile = function (file, index) {
                    if (!file) {
                        fileIds[index] = null;
                        filesProcessed++;
                        checkAllFilesProcessed();
                        return;
                    }

                    var reader = new FileReader();
                    reader.onload = function (e) {
                        var base64Data = e.target.result.split(',')[1];
                        google.script.run.withSuccessHandler(function (fileId) {
                            fileIds[index] = fileId;
                            filesProcessed++;
                            checkAllFilesProcessed();
                        }).uploadFile(base64Data, file.name);
                    };
                    reader.readAsDataURL(file);
                };

                var checkAllFilesProcessed = function () {
                    if (filesProcessed === files.length) {
                        google.script.run.saveDatasToSheet(studentid, null, userEmail, paymentMethod, classname, sitenum, studentid, studentname, null, null, null, null, null, null, fileIds[0], null, fileIds[1]);
                        updateButton();
                    }
                };

                for (var i = 0; i < files.length; i++) {
                    readFile(files[i], i);
                }
            } else {
                // 没有文件时，直接保存银行账户信息
                google.script.run.saveDatasToSheet(studentid, null, userEmail, paymentMethod, classname, sitenum, studentid, studentname, null, null, null, null, null, null, null, null, null);
                updateButton();
            }
        }
        function updatingButton() {
            var saveButton = document.getElementById('saveButton');
            saveButton.disabled = true;
            saveButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 資料儲存中...';
            saveButton.classList.add('btn-secondary');
            saveButton.classList.remove('btn-primary');
        }

        function updateButton() {
            var saveButton = document.getElementById('saveButton');
            saveButton.disabled = true;
            saveButton.innerHTML = '<i class="fas fa-check"></i> 資料已儲存';
            saveButton.classList.add('btn-secondary');
            saveButton.classList.remove('btn-primary');
        }

        console.log('userEmail: <?= userEmail ?>');
        console.log('userAccount: <?= userAccount ?>');
        console.log('userDomain: <?= userDomain ?>');
    </script>
