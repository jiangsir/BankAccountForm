<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生各項費用領款及退費登記系統</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <!-- Include Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">

    <!-- Include Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- 共用樣式 -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Custom CSS -->
    <style>
        h1 {
            font-size: 4rem;
            color: #333;
            font-weight: 600;
        }

        h2 {
            font-size: 2rem;
            color: #555;
            font-weight: 400;
        }

        h4 {
            font-size: 1.2rem;
            color: #666;
        }

        .form-control {
            height: 50px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: 2px solid #dee2e6;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .btn {
            font-size: 1.2rem;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-success {
            background: #28a745;
            border-color: #28a745;
        }

        .btn-success:hover {
            background: #218838;
            border-color: #1e7e34;
            transform: translateY(-1px);
        }

        .invisible {
            opacity: 0;
        }

        .user-info {
            background: #e8f4f8;
            border: 2px solid #bee5eb;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .query-section {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 25px;
            margin: 20px 0;
        }

        .result-section {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            min-height: 100px;
        }

        .result-section.has-content {
            background: #d4edda;
            border: 2px solid #c3e6cb;
        }

        .form-group label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group-append .btn {
            height: 50px;
        }

        .welcome-text {
            color: #007bff;
            font-weight: 500;
        }

        .student-id-display {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 5px;
            padding: 8px 12px;
            font-weight: 600;
            color: #856404;
        }

        .container-main {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .query-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .query-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #495057;
            margin: 0;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            .container-main {
                padding: 10px;
            }

            .query-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyhE-zJrfkmvJ2qCaWcybISkgrRpjxhupgRvpWoe8MfJ-FduN60XDEjqcEYoWPwLCk/exec'; // 替換為你的 GAS Web App 網址

        const urlParams = new URLSearchParams(window.location.search);
        const userEmail = urlParams.get('email') || '';
        const userAccount = urlParams.get('account') || '';

        function checkStudentID() {
            var studentID = document.getElementById('studentID').value;
            var output = document.getElementById('output');
            var resultSection = document.getElementById('result-section');

            if (!studentID) {
                output.innerHTML = generateBankAccountForm();
                resultSection.classList.add('has-content');
                return;
            }

            output.innerHTML = '<div class="text-center"><div class="spinner-border text-primary" role="status"></div> 查詢中...</div>';
            resultSection.classList.remove('has-content');

            fetch(GAS_URL + '?action=getBankAccount&studentID=' + encodeURIComponent(studentID))
                .then(function(res) { return res.json(); })
                .then(function(json) { displayResult(json.data); })
                .catch(function() {
                    output.innerHTML = '<div class="alert alert-danger">查詢失敗，請稍後再試。</div>';
                    resultSection.classList.add('has-content');
                });
        }

        function displayResult(result) {
            var output = document.getElementById('output');
            var resultSection = document.getElementById('result-section');

            if (result) {
                output.innerHTML = `
                    <div class="alert alert-success">
                        <h5><i class="fas fa-check-circle"></i> 查詢結果</h5>
                        <p class="mb-0">您已填報完畢。填報的匯款方式為：<strong>${result}</strong></p>
                    </div>
                `;
                resultSection.classList.add('has-content');
            } else {
                output.innerHTML = generateBankAccountForm();
                resultSection.classList.add('has-content');
            }
        }

        function generateBankAccountForm() {
            return `
                <div class="alert alert-info">
                    <h5><i class="fas fa-info-circle"></i> 首次填報</h5>
                    <p class="mb-3">您尚未填報匯款方式，請選擇適合的選項：</p>

                    <div class="form-group">
                        <label for="paymentMethod">
                            <i class="fas fa-credit-card"></i> 匯款方式：
                        </label>
                        <select id="paymentMethod" name="paymentMethod" class="form-control" onchange="handlePaymentMethodChange()">
                            <option value="----">-- 請選擇匯款方式 --</option>
                            <option value="現金">💰 現金</option>
                            <option value="受款學生本人帳戶">🏦 受款學生本人帳戶</option>
                            <option value="法定代理人帳戶">👨‍👩‍👧‍👦 法定代理人帳戶</option>
                        </select>
                    </div>
                </div>
            `;
        }

        function handlePaymentMethodChange() {
            var paymentMethod = document.getElementById('paymentMethod').value;
            if (paymentMethod === '----') return;

            var pageMap = {
                '現金': 'payment-cash.html',
                '受款學生本人帳戶': 'payment-student.html',
                '法定代理人帳戶': 'payment-parent.html'
            };

            if (pageMap[paymentMethod]) {
                window.location.href = pageMap[paymentMethod]
                    + '?email=' + encodeURIComponent(userEmail)
                    + '&account=' + encodeURIComponent(userAccount);
            }
        }

        window.onload = function () {
            document.getElementById('displayEmail').textContent = userEmail;
            document.getElementById('displayAccount').textContent = userAccount;
            document.getElementById('userEmail').value = userEmail;
            document.getElementById('studentID').value = userAccount;
            checkStudentID();
        };
    </script>
</head>

<body>
    <div class="container-main">
        <!-- 系統標題區域 -->
        <div class="system-header">
            <h1 class="mb-3">國立高雄師大附中</h1>
            <h2 class="mb-0">學生各項費用領款及退費登記系統</h2>
        </div>

        <!-- 使用者資訊區域 -->
        <div class="user-info">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h4 class="welcome-text mb-0">
                        <i class="fas fa-user"></i> 歡迎使用系統
                    </h4>
                    <p class="mb-0 mt-1">登入帳號：<strong id="displayEmail"></strong></p>
                </div>
                <div class="col-md-6 text-md-right">
                    <div class="student-id-display">
                        學號：<span id="displayAccount"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 隱藏欄位 -->
        <input type="hidden" id="userEmail" name="userEmail" value="">

        <!-- 查詢區域 -->
        <div class="query-section">
            <div class="query-header">
                <h3 class="query-title">
                    <i class="fas fa-search"></i> 查詢填報狀態
                </h3>
                <small class="text-muted">請輸入學號後查詢</small>
            </div>

            <div class="input-group">
                <div class="input-group-prepend">
                    <span class="input-group-text">
                        <i class="fas fa-id-card"></i>
                    </span>
                </div>
                <input type="text" id="studentID" name="studentID" class="form-control"
                       placeholder="學號">
                <div class="input-group-append">
                    <button class="btn btn-success btn-lg" onclick="checkStudentID()">
                        <i class="fas fa-search"></i> 查詢狀態
                    </button>
                </div>
            </div>

            <small class="text-muted">
                <i class="fas fa-info-circle"></i>
                請輸入學號後點擊「查詢狀態」按鈕
            </small>
        </div>

        <!-- 結果顯示區域 -->
        <div id="result-section" class="result-section">
            <div id="output">
                <div class="text-center text-muted">
                    <i class="fas fa-clock"></i> 請點擊上方「查詢狀態」按鈕開始查詢
                </div>
            </div>
        </div>
    </div>
    <script src="js/footer.js"></script>
</body>

</html>
