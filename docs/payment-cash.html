<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生各項費用領款及退費登記系統 - 現金領取</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <!-- Include Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">

    <!-- Include Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- 共用樣式 -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Custom CSS -->
    <style>
        h1 {
            font-size: 4rem;
            color: #333;
            font-weight: 600;
        }

        h2 {
            font-size: 2rem;
            color: #555;
            font-weight: 400;
        }

        h4 {
            font-size: 1.2rem;
            color: #666;
            font-weight: 500;
        }

        .form-control {
            height: 50px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: 2px solid #dee2e6;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        .form-control[readonly] {
            background-color: #f8f9fa;
            border-color: #e9ecef;
        }

        .btn {
            font-size: 1.2rem;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background: #0056b3;
            border-color: #004085;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #6c757d;
            border-color: #6c757d;
        }

        .btn-outline-primary {
            color: #007bff;
            border-color: #007bff;
            background: transparent;
        }

        .btn-outline-primary:hover {
            color: white;
            background: #007bff;
            border-color: #007bff;
        }

        .btn-lg {
            padding: 15px 35px;
            font-size: 1.3rem;
        }

        .btn-block {
            width: 100%;
        }

        .invisible {
            opacity: 0;
        }

        .container-main {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .system-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px 0;
            border-bottom: 2px solid #dee2e6;
            position: relative;
        }

        .back-to-home {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }

        .user-info {
            background: #e8f4f8;
            border: 2px solid #bee5eb;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .form-section {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group label .required {
            color: #dc3545;
        }

        .upload-section {
            background: #fff3cd;
            border: 2px solid #ffeaa7;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .attachment-link {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .attachment-link a {
            color: #155724;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }

        .attachment-link a:hover {
            color: #0c5460;
            text-decoration: underline;
        }

        .payment-method-display {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            border-radius: 8px;
            padding: 12px 15px;
            font-weight: 600;
            color: #0c5460;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .student-id-display {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            border-radius: 8px;
            padding: 12px 15px;
            font-weight: 600;
            color: #0c5460;
        }

        .modal-header {
            background: #f8d7da;
            border-bottom: 1px solid #f5c6cb;
        }

        .modal-title {
            color: #721c24;
            font-weight: 600;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #495057;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .required-fields-note {
            background: #d1ecf1;
            border-left: 4px solid #0c5460;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
        }

        .cash-highlight {
            background: #e8f5e8;
            border: 2px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .cash-icon {
            font-size: 3rem;
            color: #28a745;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            .container-main {
                padding: 10px;
            }

            .form-section {
                padding: 20px 15px;
            }

            .back-to-home {
                position: static;
                transform: none;
                margin-bottom: 20px;
            }

            .system-header {
                text-align: center;
            }
        }
    </style>
    <script src="js/config.js"></script>
    <script>

        
        const userEmail = sessionStorage.getItem('userEmail') || '';
        const userAccount = sessionStorage.getItem('userAccount') || '';

        window.onload = function () {
            document.getElementById('displayEmail').textContent = userEmail;
            document.getElementById('userEmail').value = userEmail;
            document.getElementById('studentid').value = userAccount;
        };

        function showError(message) {
            var modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = message;
            $('#errorModal').modal('show');
        }

        function validateFields() {
            var classname = document.getElementById('classname').value;
            var sitenum = document.getElementById('sitenum').value;
            var studentname = document.getElementById('studentname').value;
            var studentid = document.getElementById('studentid').value;
            var studentPid = document.getElementById('studentPid').value;
            var studentAddress = document.getElementById('studentAddress').value;
            var fileInput1 = document.getElementById('fileAttachment1').files.length;
            var fileInput2 = document.getElementById('fileAttachment3').files.length;

            if (!classname) { showError('班級未填寫'); return false; }
            if (!sitenum) { showError('座號未填寫'); return false; }
            if (!studentname) { showError('學生姓名未填寫'); return false; }
            if (!studentid) { showError('學號未填寫'); return false; }
            if (!studentPid) { showError('學生身分證字號未填寫'); return false; }
            if (!studentAddress) { showError('學生戶籍地址未填寫'); return false; }
            if (!fileInput1) { showError('「附件1」未選擇'); return false; }
            if (!fileInput2) { showError('「附件3」未選擇'); return false; }
            return true;
        }

        function uploadFileToGAS(file) {
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var base64Data = e.target.result.split(',')[1];
                    fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'uploadFile', base64Data: base64Data, fileName: file.name })
                    })
                    .then(function(res) { return res.json(); })
                    .then(function(json) { resolve(json.fileId); })
                    .catch(reject);
                };
                reader.readAsDataURL(file);
            });
        }

        async function saveCash() {
            if (!validateFields()) return;

            var saveButton = document.getElementById('saveButton');
            saveButton.disabled = true;
            saveButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 資料儲存中...';
            saveButton.classList.replace('btn-primary', 'btn-secondary');

            try {
                var file1 = document.getElementById('fileAttachment1').files[0];
                var file2 = document.getElementById('fileAttachment3').files[0];
                var fileId1 = file1 ? await uploadFileToGAS(file1) : null;
                var fileId2 = file2 ? await uploadFileToGAS(file2) : null;

                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'saveDatasToSheet',
                        studentID: userAccount,
                        bankAccount: null,
                        userEmail: userEmail,
                        paymentMethod: '現金',
                        classname: document.getElementById('classname').value,
                        sitenum: document.getElementById('sitenum').value,
                        studentid: document.getElementById('studentid').value,
                        studentname: document.getElementById('studentname').value,
                        studentPid: document.getElementById('studentPid').value,
                        studentAddress: document.getElementById('studentAddress').value,
                        accountname: null, parentPid: null, parentBirth: null,
                        fileUpload1: null, fileUpload2: null,
                        fileAttachment1: fileId1, fileAttachment2: null, fileAttachment3: fileId2
                    })
                });

                saveButton.innerHTML = '<i class="fas fa-check"></i> 資料已儲存';
            } catch(err) {
                saveButton.disabled = false;
                saveButton.classList.replace('btn-secondary', 'btn-primary');
                saveButton.innerHTML = '<i class="fas fa-save"></i> 儲存資料';
                showError('儲存失敗，請稍後再試。');
            }
        }
    </script>
</head>

<body>
    <div class="container-main">
        <!-- 系統標題區域 -->
        <div class="system-header">
            <!-- 回到首頁按鈕 -->
            <div class="back-to-home">
                <a href="index.html" class="btn btn-outline-primary">
                    <i class="fas fa-home"></i> 回到首頁
                </a>
            </div>

            <h1 class="mb-3">國立高雄師大附中</h1>
            <h2 class="mb-0">學生各項費用領款及退費登記系統</h2>
        </div>

        <!-- 現金領取提示區域 -->
        <div class="cash-highlight">
            <div class="cash-icon">
                <i class="fas fa-money-bill-wave"></i>
            </div>
            <h3 class="text-success font-weight-bold">現金領取方式</h3>
            <p class="mb-0">您選擇了現金領取，無需提供銀行帳戶資料</p>
        </div>

        <!-- 使用者資訊區域 -->
        <div class="user-info">
            <div class="row">
                <div class="col-md-6">
                    <h4 class="mb-2">
                        <i class="fas fa-user text-primary"></i> 登入帳號
                    </h4>
                    <p class="mb-0" id="displayEmail"></p>
                </div>
                <div class="col-md-6">
                    <h4 class="mb-2">
                        <i class="fas fa-hand-holding-usd text-success"></i> 匯款方式
                    </h4>
                    <div class="payment-method-display">
                        <i class="fas fa-money-bill"></i>
                        現金
                    </div>
                </div>
            </div>
        </div>

        <!-- 隱藏欄位 -->
        <input type="hidden" id="userEmail" name="userEmail" value="">
        <input type="hidden" id="paymentMethod" name="paymentMethod" value="現金">

        <!-- 學生基本資料區域 -->
        <div class="form-section">
            <h3 class="section-title">
                <i class="fas fa-user-graduate"></i>
                學生基本資料填寫
            </h3>

            <div class="required-fields-note">
                <i class="fas fa-info-circle text-info"></i>
                <strong>填寫說明：</strong>請完整填寫以下資料，標示 <span class="text-danger">*</span> 為必填欄位
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="classname">
                            <i class="fas fa-school"></i>
                            班級 <span class="required">*</span>
                        </label>
                        <input type="text" id="classname" name="classname" class="form-control" placeholder="請輸入班級">
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label for="sitenum">
                            <i class="fas fa-sort-numeric-up"></i>
                            座號 <span class="required">*</span>
                        </label>
                        <input type="text" id="sitenum" name="sitenum" class="form-control" placeholder="請輸入座號">
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label for="studentname">
                            <i class="fas fa-user-circle"></i>
                            學生姓名 <span class="required">*</span>
                        </label>
                        <input type="text" id="studentname" name="studentname" class="form-control" placeholder="請輸入學生姓名">
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label for="studentid">
                            <i class="fas fa-id-card"></i>
                            學號 <span class="required">*</span>
                        </label>
                        <input type="text" id="studentid" name="studentid" class="form-control student-id-display"
                               placeholder="學號">
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label for="studentPid">
                            <i class="fas fa-address-card"></i>
                            學生身分證字號 <span class="required">*</span>
                        </label>
                        <input type="text" id="studentPid" name="studentPid" class="form-control" placeholder="請輸入學生身分證字號">
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label for="studentAddress">
                            <i class="fas fa-home"></i>
                            學生戶籍地址 <span class="required">*</span>
                        </label>
                        <input type="text" id="studentAddress" name="studentAddress" class="form-control" placeholder="請輸入學生戶籍地址">
                    </div>
                </div>
            </div>
        </div>

        <!-- 檔案上傳區域 -->
        <div class="upload-section">
            <h3 class="section-title">
                <i class="fas fa-cloud-upload-alt"></i>
                檔案上傳
            </h3>

            <div class="attachment-link">
                <a href="https://docs.google.com/document/d/1Lr-_tyDJiHzRGUL8hlE4PXWswF14V6l3/edit?usp=drive_link" target="_blank">
                    <i class="fas fa-download"></i>
                    附件1-個人資料提供同意書
                </a>
            </div>

            <div class="form-group">
                <label for="fileAttachment1">
                    <i class="fas fa-file-upload"></i>
                    上傳「附件1-個人資料提供同意書」<span class="required">*</span>
                </label>
                <input type="file" id="fileAttachment1" name="fileAttachment1" class="form-control">
                <small class="form-text text-muted">
                    <i class="fas fa-info-circle"></i>
                    請先下載上方連結的同意書，填寫完成後上傳
                </small>
            </div>

            <div class="attachment-link">
                <a href="https://docs.google.com/document/d/1fNGUGGtQzxhbxaOgTciAWcqjDpCL9daH/edit?usp=drive_link" target="_blank">
                    <i class="fas fa-download"></i>
                    附件3-領用現金同意書
                </a>
            </div>

            <div class="form-group">
                <label for="fileAttachment3">
                    <i class="fas fa-file-upload"></i>
                    上傳「附件3-領用現金同意書」<span class="required">*</span>
                </label>
                <input type="file" id="fileAttachment3" name="fileAttachment3" class="form-control">
                <small class="form-text text-muted">
                    <i class="fas fa-info-circle"></i>
                    請先下載上方連結的同意書，填寫完成後上傳
                </small>
            </div>
        </div>

        <!-- 提交按鈕 -->
        <div class="text-center">
            <button id="saveButton" class="btn btn-primary btn-lg btn-block" onclick="saveCash()">
                <i class="fas fa-save"></i> 儲存資料
            </button>
        </div>

        <h4 id="output" class="mt-3 text-center"></h4>
    </div>

    <!-- Error Modal -->
    <div class="modal fade" id="errorModal" tabindex="-1" role="dialog" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">
                        <i class="fas fa-exclamation-triangle"></i> 錯誤提醒
                    </h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- 錯誤消息將顯示在這裡 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">
                        <i class="fas fa-times"></i> 關閉
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/footer.js"></script>
</body>

</html>
