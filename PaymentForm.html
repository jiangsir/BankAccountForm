    <script>
        function checkStudentID() {
            var studentID = document.getElementById('studentID').value;
            var resultSection = document.getElementById('result-section');
            var output = document.getElementById('output');
            
            // 顯示載入狀態
            output.innerHTML = '<div class="text-center"><i class="spinner-border text-primary" role="status"></i> 查詢中...</div>';
            resultSection.classList.remove('has-content');
            
            google.script.run.withSuccessHandler(displayResult).getBankAccount(studentID);
        }

        function displayResult(result) {
            var output = document.getElementById('output');
            var resultSection = document.getElementById('result-section');
            
            if (result) {
                output.innerHTML = `
                    <div class="alert alert-success">
                        <h5><i class="fas fa-check-circle"></i> 查詢結果</h5>
                        <p class="mb-0">您已填報完畢。填報的匯款方式為：<strong>${result}</strong></p>
                    </div>
                `;
                resultSection.classList.add('has-content');
            } else {
                output.innerHTML = generateBankAccountForm();
                resultSection.classList.add('has-content');
            }
        }

        function generateBankAccountForm() {
            return `
                <div class="alert alert-info">
                    <h5><i class="fas fa-info-circle"></i> 首次填報</h5>
                    <p class="mb-3">您尚未填報匯款方式，請選擇適合的選項：</p>
                    
                    <div class="form-group">
                        <label for="paymentMethod">
                            <i class="fas fa-credit-card"></i> 匯款方式：
                        </label>
                        <select id="paymentMethod" name="paymentMethod" class="form-control" onchange="handlePaymentMethodChange()">
                            <option value="----">-- 請選擇匯款方式 --</option>
                            <option value="現金">💰 現金</option>
                            <option value="受款學生本人帳戶">🏦 受款學生本人帳戶</option>
                            <option value="法定代理人帳戶">👨‍👩‍👧‍👦 法定代理人帳戶</option>
                        </select>
                    </div>
                </div>
            `;
        }

        function handlePaymentMethodChange() {
            var paymentMethod = document.getElementById('paymentMethod').value;
            
            if (paymentMethod === '----') {
                return;
            }
            
            // 顯示載入狀態
            var output = document.getElementById('output');
            output.innerHTML += '<div class="text-center mt-3"><i class="spinner-border text-primary" role="status"></i> 載入表單中...</div>';
            
            google.script.run.withSuccessHandler(function(html) {
                document.open();
                document.write(html);
                document.close();
            }).loadFormBasedOnPaymentMethod(paymentMethod);
        }

        window.onload = function () {
            checkStudentID(); // 頁面載入完成後自動調用查詢函數
        };
        
        console.log('userEmail: <?= userEmail ?>');
        console.log('userAccount: <?= userAccount ?>');
        console.log('userDomain: <?= userDomain ?>');
    </script>
