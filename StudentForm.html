<html>

<head>
    <base target="_top">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <!-- Include Bootstrap CSS -->

    <!-- Include Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <!-- Custom CSS -->
    <style>
        h1 {
            font-size: 5rem;
            /* Change this to adjust the size of the h1 text */
        }

        .form-control {
            height: 100px;
            /* Change this to adjust the size of the input field */
            font-size: 5rem;
            /* Change this to adjust the size of the input text */
        }

        .invisible {
            opacity: 0;
        }

    <script>
        function checkStudentID() {
            var studentID = document.getElementById('studentID').value;
            google.script.run.withSuccessHandler(displayResult).getBankAccount(studentID);
        }

        function displayResult(result) {
            var output = document.getElementById('output');
            if (result) {
                output.innerHTML = '退款方式: ' + result;
            } else {
                output.innerHTML = generateBankAccountForm();
            }
        }

        function generateBankAccountForm() {
            return `
<div class="input-group mb-2">
    <div class="form-group">
        <label for="paymentMethod">退款方式:</label>
        <select id="paymentMethod" name="paymentMethod" class="form-control" onchange="handlePaymentMethodChange()">
            <option value="----">請選擇退款方式</option>
            <option value="現金">現金</option>
            <option value="受款學生本人帳戶">受款學生本人帳戶</option>
            <option value="法定代理人帳戶">法定代理人帳戶</option>
        </select>
    </div>
</div>`;
        }

        function handlePaymentMethodChange() {
            var paymentMethod = document.getElementById('paymentMethod').value;
            google.script.run.withSuccessHandler(function(html) {
                document.open();
                document.write(html);
                document.close();
            }).loadFormBasedOnPaymentMethod(paymentMethod);
        }

        function saveBankAccount() {
            var studentID = document.getElementById('studentID').value;
            var classname = document.getElementById('classname').value;
            var sitenum = document.getElementById('sitenum').value;
            var studentid = document.getElementById('studentid').value;
            var studentname = document.getElementById('studentname').value;
            var bankAccount = document.getElementById('bankAccount').value;
            var userEmail = document.getElementById('userEmail').value;
            var paymentMethod = document.getElementById('paymentMethod').value;
            google.script.run.saveBankAccount(studentID, bankAccount, userEmail, paymentMethod, classname, sitenum, studentid, studentname);
            document.getElementById('output').innerHTML = '銀行帳號已儲存';
        }

        // window.onload = function () {
        //     var studentID = document.getElementById('studentID');
        //     studentID.focus();

        //     var checkButton = document.querySelector('.btn-primary');
        //     checkButton.onclick = checkStudentID;
        // };

        window.onload = function () {
            checkStudentID(); // 页面加载完成后自动调用查询函数
        };
        
        console.log('userEmail: <?= userEmail ?>');
        console.log('userAccount: <?= userAccount ?>');
        console.log('userDomain: <?= userDomain ?>');
    </script>
</head>

<body>
    <div class="container d-flex vh-100">
        <div class="row justify-content-center w-100">
            <div class="col-md-12">
                <h1 class="text-center mb-4">高師大附中學生退款登記系統</h1>
                <h1 class="text-center mb-4">學生登記表單</h1>
                <h4>登入帳號: <?= userEmail ?></h4>
                <input type="hidden" id="userEmail" name="userEmail" class="form-control" value="<?= userEmail ?>">
                <div class="input-group mb-2">
                    <input type="text" id="studentID" name="studentID" class="form-control" placeholder="輸入學號"
                        value="<?= userAccount ?>" readonly="readonly">
                    <div class="input-group-append">
                        <button class="btn btn-success btn-lg" onclick="checkStudentID()">查詢</button>
                    </div>
                </div>
                <h4 id="output"></h4>
            </div>
        </div>
    </div>
</body>

</html>
