    <script>
        function checkStudentID() {
            var studentID = document.getElementById('studentID').value;
            google.script.run.withSuccessHandler(displayResult).getBankAccount(studentID);
        }

        function displayResult(result) {
            var output = document.getElementById('output');
            if (result) {
                output.innerHTML = '退款帳號: ' + result;
            } else {
                output.innerHTML = `
<div class="input-group mb-2">
    <input type="text" id="bankAccount" name="bankAccount" class="form-control" placeholder="輸入退款銀行帳戶">
    <div class="input-group-append">
        <button class="btn btn-primary btn-lg" onclick="saveBankAccount()">儲存</button>
    </div>
</div>
    `;
            }
        }

        function saveBankAccount() {
            var studentID = document.getElementById('studentID').value;
            var bankAccount = document.getElementById('bankAccount').value;
            var userEmail = document.getElementById('userEmail').value;
            google.script.run.saveBankAccount(studentID, bankAccount, userEmail);
            document.getElementById('output').innerHTML = '銀行帳號已儲存';
        }
